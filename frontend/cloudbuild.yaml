steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - --build-arg
      - VITE_GOOGLE_MAPS_EMBED_API_KEY=${_VITE_GOOGLE_MAPS_EMBED_API_KEY}
      - --build-arg
      - VITE_GA_MEASUREMENT_ID=${_VITE_GA_MEASUREMENT_ID}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _VITE_API_BASE_URL: ""
  _VITE_GOOGLE_MAPS_EMBED_API_KEY: ""
  _VITE_GA_MEASUREMENT_ID: ""
  _IMAGE: ""
